// ---------- Recebidos: o outro lado do encaminhamento ----------
// prt_encaminhamentos guarda origem/destino desnormalizados, mas o TELEFONE de
// quem indicou não: para ligar de volta, o certo é o contato de hoje, então
// busco em assist_parceiros.
async function encBuscarRecebidos(){
  _encRecebidos=[];_encOrigens={};
  if(!_parceiroId) return _encRecebidos;
  var H={headers:{'apikey':SB_KEY,'Authorization':AUTHZ},cache:'no-store'};
  try{
    var r=await fetch(SB_URL+'/rest/v1/prt_encaminhamentos?destino_parceiro_id=eq.'+_parceiroId+'&order=criado_em.desc&limit=50&select=*',H);
    var j=await r.json();
    _encRecebidos=Array.isArray(j)?j:[];
    var ids=[];
    _encRecebidos.forEach(function(e){if(e.origem_parceiro_id&&ids.indexOf(e.origem_parceiro_id)<0)ids.push(e.origem_parceiro_id)});
    if(ids.length){
      var ro=await fetch(SB_URL+'/rest/v1/assist_parceiros?id=in.('+ids.join(',')+')&select=id,nome,cidade,uf,telefone,whatsapp',H);
      var os=await ro.json();
      if(Array.isArray(os)) os.forEach(function(p){_encOrigens[p.id]=p});
    }
  }catch(e){console.error(e)}
  return _encRecebidos;
}

function encNovosDesde(ts){
  return (_encRecebidos||[]).filter(function(e){

  }).length;
}
function encAtualizarBadge(){
  var b=document.getElementById('badgeEnc');if(!b)return;

}
async function encBadgeAoEntrar(){

      '</div>'+

// ===== FINANCEIRO (melhorado) =====
async function renderFinanceiro(el){
  el.innerHTML='<div class="page-header"><h1>Financeiro</h1></div>'+
    '<div class="card" style="margin-bottom:16px;background:var(--primary-bg);border-color:var(--primary)"><p class="text-sm" style="color:var(--text)">A Stonni fecha o mês, envia o <strong>orçamento</strong> e você aprova; o pagamento sai depois disso, <strong>até o dia 10 do mês seguinte</strong>. Confira os valores antes de aprovar.</p></div>'+
    '<div id="finArea"><div class="loading-full"><span class="spinner"></span> Carregando...</div></div>';

    pags.forEach(function(p){

      // A NFS-e do servico prestado passa a ser condicao para aprovar: e o
      // documento que a Bononi precisa ter em maos para pagar. Antes havia aqui
      // um campo com o NUMERO da NF, que ela preenchia ANTES de receber -- e que
      // nunca foi usado (0 de 8 fechamentos). Agora e o arquivo, no momento certo.
      var temNfse=!!p.nfse_arquivo_path;
      var naEtapaDoAceite=(p.status==='pendente'&&p.relatorio_enviado);
      var podeAprovar=(naEtapaDoAceite&&temNfse);
      var etapa=p.status==='pago'

          : p.status==='cancelado'
            ? '<span class="text-muted">Fechamento cancelado.</span>'
            : naEtapaDoAceite
              ? (temNfse
                  ? '<span style="color:var(--warning)">Orçamento enviado em '+fmtData(p.data_envio_relatorio)+'. NFS-e anexada — confira os valores e aprove.</span>'
                  : '<span style="color:var(--warning)">Orçamento enviado em '+fmtData(p.data_envio_relatorio)+'. Confira os valores e <b>anexe a NFS-e</b> para poder aprovar.</span>')
              : '<span class="text-muted">Aguardando o orçamento da Stonni.</span>';
      // Ver a NFS-e continua disponivel depois de aprovado e de pago: e o

      var linhaNfse=temNfse
        ? '<div class="text-xs mt-8" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="text-muted">NFS-e:</span><a href="#" onclick="nfseAbrir('+p.id+');return false" style="color:var(--primary-txt);font-weight:600">'+esc(p.nfse_arquivo_nome||'ver arquivo')+'</a><span class="text-muted">'+(p.nfse_enviada_em?'enviada em '+fmtData(p.nfse_enviada_em):'')+'</span></div>'
        : '';
      // O comprovante da transferencia, do lado de quem RECEBE. So aparece
      // quando existe: os fechamentos pagos antes desta funcao nao tem, e uma
      // linha dizendo "a Stonni nao anexou" viraria cobranca por algo que nem
      // era possivel na epoca.
      var linhaComprovante=p.comprovante_arquivo_path
        ? '<div class="text-xs mt-8" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="text-muted">Comprovante do pagamento:</span><a href="#" onclick="comprovanteAbrir('+p.id+');return false" style="color:var(--primary-txt);font-weight:600">'+esc(p.comprovante_arquivo_nome||'ver arquivo')+'</a><span class="text-muted">'+(p.comprovante_enviado_em?'anexado em '+fmtData(p.comprovante_enviado_em):'')+'</span></div>'
        : '';
      var botoes='';
      if(naEtapaDoAceite){
        botoes='<div class="flex gap-8 mt-8" style="flex-wrap:wrap">'+
          '<button class="btn btn-outline btn-sm" style="width:auto" onclick="nfseAnexar('+p.id+')">'+ico('paperclip',13)+(temNfse?' Trocar NFS-e':' Anexar NFS-e')+'</button>'+
          (podeAprovar?'<button class="btn btn-primary btn-sm" style="width:auto" onclick="aprovarOrcamento('+p.id+')">'+ico('circle-check',13)+' Aprovar orçamento</button>':'')+
        '</div>'+
        (podeAprovar
          ? '<p class="text-xs text-muted" style="margin-top:4px">Aprovando, você confirma os valores das '+p.qtd_os+' OS deste mês. A Stonni paga depois disso.</p>'

      }
      html+='<div class="card" id="fin-card-'+p.id+'" style="margin-bottom:10px"><div class="flex justify-between items-center mb-8"><span class="fw-700" style="font-size:1rem">'+esc(fmtMes(p.mes_referencia))+'</span><span class="badge '+st+'">'+esc(PAG_ROTULO[p.status]||p.status)+'</span></div>'+
        '<div class="flex justify-between text-sm mb-8"><span class="text-muted">'+p.qtd_os+' OS</span><span class="text-muted">Serviços: '+fmt(p.valor_servicos)+'</span><span class="fw-700 text-primary" style="font-size:1.1rem">'+fmt(p.valor_total)+'</span></div>'+
        '<div class="text-xs" style="line-height:1.5">'+etapa+'</div>'+
        linhaNfse+
        linhaComprovante+
        botoes+
      '</div>';
    });box.innerHTML=html;
    // Chegou clicando em "Ver e aprovar": leva o olho ate o cartao certo. Com
    // varios meses na tela, parar no topo ainda deixa a pessoa procurando.
    if(window._focarPendencia){
      window._focarPendencia=false;

// ---------------------------------------------- NFS-e do servico prestado
// Bucket PRIVADO: nota fiscal nao fica em link publico. A tela abre por URL
// assinada, de uma hora, do mesmo jeito que os anexos do ciclo de compra.
var DOCS_BUCKET='assist-parceiros-docs';
// parceiro_id na 1a pasta: e o que vai permitir escopar o bucket por autorizada
// quando a RLS de storage entrar.
function nfseAnexar(pagId){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='application/pdf,image/*';
  inp.onchange=async function(){
    var file=inp.files&&inp.files[0];
    if(!file)return;
    if(file.size>10*1024*1024){toast('Arquivo muito grande — máximo 10 MB','error');return}
    toast('Enviando a NFS-e...','aviso');
    try{
      var limpo=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      var path=(_parceiroId||0)+'/nfse/'+pagId+'/'+Date.now()+'-'+limpo;
      var sess=await sb.auth.getSession();
      var token=(sess&&sess.data&&sess.data.session)?sess.data.session.access_token:SB_KEY;
      var up=await fetch(SB_URL+'/storage/v1/object/'+DOCS_BUCKET+'/'+path,{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},
        body:file
      });
      if(!up.ok)throw new Error('o upload falhou (HTTP '+up.status+')');
      // So grava a referencia DEPOIS que o arquivo subiu: na ordem inversa, uma
      // falha no upload deixaria o banco apontando para arquivo que nao existe.
      var r=await fetch(SB_URL+'/rest/v1/prt_pagamentos?id=eq.'+pagId,{
        method:'PATCH',
        headers:{'apikey':SB_KEY,'Authorization':AUTHZ,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({nfse_arquivo_path:path,nfse_arquivo_nome:file.name,nfse_enviada_em:new Date().toISOString()})
      });
      if(!r.ok){var j=await r.json().catch(function(){return null});throw new Error((j&&j.message)||('HTTP '+r.status))}
      bononiLog('ACAO','pagamento','ANEXAR_NFSE',String(pagId),file.name);
      toast('NFS-e anexada! Agora você pode aprovar o orçamento.','success');
      navegar('financeiro');
    }catch(e){
      console.error(e);
      bononiLog('ERRO','pagamento','ANEXAR_NFSE',String(pagId),file.name,e&&e.message);
      toast('Não deu para anexar a NFS-e: '+(e&&e.message),'error');
    }
  };
  inp.click();
}
async function nfseAbrir(pagId){
  try{
    var q=await fetch(SB_URL+'/rest/v1/prt_pagamentos?id=eq.'+pagId+'&select=nfse_arquivo_path',{headers:{'apikey':SB_KEY,'Authorization':AUTHZ}});
    var arr=await q.json();
    var path=(Array.isArray(arr)&&arr.length)?arr[0].nfse_arquivo_path:null;
    if(!path)throw new Error('a NFS-e não está mais anexada');
    var sess=await sb.auth.getSession();
    var token=(sess&&sess.data&&sess.data.session)?sess.data.session.access_token:SB_KEY;
    var r=await fetch(SB_URL+'/storage/v1/object/sign/'+DOCS_BUCKET+'/'+path,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({expiresIn:3600})
    });
    var d=await r.json().catch(function(){return null});
    if(!r.ok||!d||!d.signedURL)throw new Error((d&&d.message)||('HTTP '+r.status));
    window.open(SB_URL+'/storage/v1'+d.signedURL,'_blank');
  }catch(e){
    console.error(e);
    toast('Não deu para abrir a NFS-e: '+(e&&e.message),'error');
  }
}

/* Comprovante da transferencia que a STONNI fez. Gemeo de nfseAbrir, e o par
   do documento: a NFS-e prova o que foi cobrado, o comprovante prova o que foi
   pago. Aqui a autorizada so ABRE -- quem anexa e a Stonni, no app interno. */
async function comprovanteAbrir(pagId){
  try{

    var arr=await q.json();
    var path=(Array.isArray(arr)&&arr.length)?arr[0].comprovante_arquivo_path:null;
    if(!path)throw new Error('o comprovante não está mais anexado');
    var sess=await sb.auth.getSession();
    var token=(sess&&sess.data&&sess.data.session)?sess.data.session.access_token:SB_KEY;
    var r=await fetch(SB_URL+'/storage/v1/object/sign/'+DOCS_BUCKET+'/'+path,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({expiresIn:3600})
    });
    var d=await r.json().catch(function(){return null});
    if(!r.ok||!d||!d.signedURL)throw new Error((d&&d.message)||('HTTP '+r.status));
    window.open(SB_URL+'/storage/v1'+d.signedURL,'_blank');
  }catch(e){
    console.error(e);
    toast('Não deu para abrir o comprovante: '+(e&&e.message),'error');

}

/* ---------------------------------------------------------------
   AVISO DE PENDÊNCIA — orçamento esperando o aceite da autorizada

   Aprovar orçamento é etapa nova: ela não tem o hábito de procurar. E o app
   restaura a última página aberta, então pode nem passar pelo Início. Por
   isso o aviso mora fora de #paginaConteudo e aparece em qualquer tela.
   --------------------------------------------------------------- */
var _pendAprov = [];    // orçamentos do mês esperando o aceite dela
var _pendComprov = [];  // pedidos de peça esperando o comprovante dela

async function pendenciasCarregar(){
  if(!_parceiroId){ _pendAprov=[]; _pendComprov=[]; pendenciasRender(); return; }
  var H={headers:{'apikey':SB_KEY,'Authorization':AUTHZ},cache:'no-store'};
  // As duas consultas em paralelo e cada uma com o seu catch: uma falhando não
  // pode apagar o aviso da outra.
  var a=fetch(SB_URL+'/rest/v1/prt_pagamentos?parceiro_id=eq.'+_parceiroId
      +'&status=eq.pendente&relatorio_enviado=is.true&order=mes_referencia.asc'
      +'&select=id,mes_referencia,valor_total,qtd_os,nfse_arquivo_path', H)
    .then(function(r){return r.json()})
    .then(function(x){ _pendAprov=Array.isArray(x)?x:[] })
    // Sem aviso é melhor que aviso errado: falhando, a faixa some em vez de
    // mostrar um número velho.
    .catch(function(){ _pendAprov=[] });

  var b=fetch(SB_URL+'/rest/v1/prt_compras_detalhe?parceiro_id=eq.'+_parceiroId
      +'&status=eq.aguardando_pagamento&order=criado_em.asc'
      +'&select=id,codigo,valor_final,data_vencimento,anexos_comprovante', H)
    .then(function(r){return r.json()})
    .then(function(x){ _pendComprov=Array.isArray(x)?x:[] })
    .catch(function(){ _pendComprov=[] });

  await Promise.all([a,b]);
  pendenciasRender();
}

// Uma faixa, um assunto. Duas pendências viram duas faixas: juntar as duas num
// texto só faria a pessoa ler tudo para descobrir o que é dela agora.
function avisoFaixa(o){
  return '<div role="region" aria-label="'+esc(o.rotulo)+'" style="background:#FFF4E5;border:1px solid #F5B36B;border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">'+
      '<span style="line-height:1;color:#8a5a00;flex:0 0 auto">'+ico('triangle-alert',22)+'</span>'+
      '<div style="flex:1 1 280px;min-width:0">'+
        '<div style="font-weight:700;color:#8a5a00;font-size:1rem;margin-bottom:4px">'+o.titulo+'</div>'+
        '<div style="font-size:.85rem;color:#7a5410;line-height:1.5">'+o.corpo+'</div>'+
      '</div>'+
      '<button class="btn btn-primary btn-sm" style="width:auto;flex:0 0 auto" onclick="'+o.acao+'">'+
        ico('arrow-right',14)+' '+esc(o.botao)+
      '</button>'+
    '</div>';
}

function contador(id, n, umQuando1, umQuandoN){
  var b=document.getElementById(id);
  if(!b) return;
  b.textContent=n;
  // sem isto o leitor de tela anuncia só o número, sem dizer de quê
  b.setAttribute('aria-label', n===1?umQuando1:n+' '+umQuandoN);
  if(n>0) b.classList.remove('hidden'); else b.classList.add('hidden');
}

function pendenciasRender(){
  var nA=_pendAprov.length, nC=_pendComprov.length;

  contador('badgeFin', nA, '1 orçamento esperando sua aprovação', 'orçamentos esperando sua aprovação');
  contador('badgePec', nC, '1 pedido de peça esperando o comprovante', 'pedidos de peça esperando o comprovante');

  var el=document.getElementById('avisoPendencia');
  if(!el) return;
  var out='';

  // Na própria tela do assunto a faixa some: ali o cartão e o botão já estão
  // à vista, e repetir vira ruído.
  if(nA>0 && _paginaAtual!=='financeiro'){
    var total=_pendAprov.reduce(function(s,p){return s+(parseFloat(p.valor_total)||0)},0);
    var faltaNota=_pendAprov.filter(function(p){return !p.nfse_arquivo_path}).length;
    var meses=_pendAprov.map(function(p){return fmtMes(p.mes_referencia)}).join(', ');
    out+=avisoFaixa({
      rotulo:'Orçamento esperando sua aprovação',
      titulo:(nA===1?'Você tem 1 orçamento esperando sua aprovação'
                    :'Você tem '+nA+' orçamentos esperando sua aprovação'),
      corpo:'A Stonni fechou '+(nA===1?'o mês de ':'os meses de ')+'<b>'+esc(meses)+'</b>, '+
            'no total de <b>'+fmt(total)+'</b>. '+
            (faltaNota>0?'Confira os valores, <b>anexe a nota fiscal do serviço</b> e aprove.'
                        :'Confira os valores e aprove.')+
            ' <b>O pagamento só sai depois do seu aceite.</b>',
      botao:'Ver e aprovar',
      acao:'window._focarPendencia=true;navegar(\'financeiro\')'
    });
  }

  if(nC>0 && _paginaAtual!=='comprar-pecas'){
    var soma=_pendComprov.reduce(function(s,p){return s+(parseFloat(p.valor_final)||0)},0);
    var codigos=_pendComprov.map(function(p){return p.codigo||('#'+p.id)}).join(', ');
    // Dois momentos dentro do MESMO status, com ações diferentes: anexar, ou
    // avisar depois de já ter anexado. Dizer a errada faz procurar o que não existe.
    var faltaAnexo=_pendComprov.filter(function(p){return (Number(p.anexos_comprovante)||0)===0}).length;
    var vence=_pendComprov.filter(function(p){return p.data_vencimento})
                          .map(function(p){return fmtData(p.data_vencimento)});
    out+=avisoFaixa({
      rotulo:'Pedido de peça esperando o comprovante',
      titulo:(nC===1?'Você tem 1 pedido de peça esperando o pagamento'
                    :'Você tem '+nC+' pedidos de peça esperando o pagamento'),
      corpo:(nC===1?'O pedido ':'Os pedidos ')+'<b>'+esc(codigos)+'</b>, '+
            'no total de <b>'+fmt(soma)+'</b>'+
            (vence.length?' (vence '+esc(vence.join(', '))+')':'')+'. '+
            (faltaAnexo>0?'<b>Pague e anexe o comprovante.</b>'
                         :'O comprovante já está anexado — <b>falta avisar a Stonni</b>.')+
            ' A peça só é liberada depois disso.',
      botao:'Ver o pedido',
      acao:'window._focarPedido=true;navegar(\'comprar-pecas\')'
    });
  }

  el.innerHTML=out;
}

// Rotulo publico do fechamento e competencia por extenso. Mesmas palavras da

var PAG_ROTULO={pendente:'Pendente',aprovado:'Aprovado',pago:'Pago',cancelado:'Cancelado'};
function fmtMes(m){var q=String(m||'').split('-');return q.length===2?q[1]+'/'+q[0]:(m||'-')}

// O aceite do orcamento. Confirmacao em modal de proposito: e o ponto em que
// ela declara concordar com o valor, e um clique sem volta ali gera discussao
// depois. Modal proprio -- o app nao usa confirm() nativo (Safari iOS).
function aprovarOrcamento(pagId){
  document.querySelectorAll('.modal-overlay.show').forEach(function(m){m.classList.remove('show')});
  var html='<div class="modal-overlay show" id="modalAprovaOrc"><div class="modal">'+
    '<div class="modal-title">Aprovar orçamento?<button class="modal-close" aria-label="Fechar" onclick="this.closest(\'.modal-overlay\').remove()">'+ico('x',20)+'</button></div>'+
    '<p class="text-sm text-muted mb-16">Você confirma os valores deste fechamento. A Stonni libera o pagamento depois do seu aceite.</p>'+
    '<div class="flex gap-8 mt-16" style="justify-content:flex-end">'+
      '<button class="btn btn-ghost btn-sm" style="width:auto" onclick="this.closest(\'.modal-overlay\').remove()">Voltar</button>'+
      '<button class="btn btn-primary btn-sm" style="width:auto" onclick="confirmarAprovacaoOrcamento('+pagId+')">Aprovar orçamento</button>'+
    '</div>'+
  '</div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}

  try{

// ===== PEDIDO DE PEÇA — CICLO DE NF E PAGAMENTO =====
// A autorizada monta o pedido na aba Catálogo; aqui ela acompanha o resto do
// ciclo: baixa a NF que a Stonni emitiu, paga, anexa o comprovante e avisa.
// Portado de stonni-assistencia/modules/pedidos.js (face autorizada), reescrito
// no idioma deste arquivo (ES5, sem template literal).
//
// NÃO CONFUNDIR com a tela Financeiro: lá é o fechamento do que a STONNI PAGA à
// autorizada pelos serviços de garantia. Aqui o dinheiro vai na direção oposta
// — a autorizada paga a Stonni pelas peças. Ciclos separados, telas separadas.
//
// O front NÃO decide a máquina de estados: manda só {status} e o guard trigger
// do banco valida a transição, exige o anexo e carimba as datas. Data gravada
// aqui seria a data do relógio do celular da autorizada.
//
// Bucket PRIVADO prt-compras-anexos: NF e comprovante são fiscais, então o link
// é assinado no clique e expira. Diferente de prt-os-fotos, que é público.
var PC_BUCKET='prt-compras-anexos';
// Rótulo + cor + o que a etapa espera da autorizada. Mesmos textos do app
// interno, de propósito: ela pode ouvir a Stonni citando o status por telefone.

  pendente:            {rot:'Aguardando aprovação', cls:'badge-enviada',  dica:'A Stonni está analisando o pedido.'},
  aprovado:            {rot:'Aprovado',             cls:'badge-aprovada', dica:'Aprovado. A Stonni vai enviar o orçamento.'},
  orcamento_enviado:   {rot:'Orçamento enviado',    cls:'badge-aprovada', dica:'Orçamento disponível abaixo. Aguarde a liberação para pagamento.'},
  aguardando_pagamento:{rot:'Aguardando pagamento', cls:'badge-enviada',  dica:'Pague e anexe o comprovante.'},
  comprovante_enviado: {rot:'Comprovante enviado',  cls:'badge-aprovada', dica:'A Stonni está validando o pagamento.'},
  pagamento_validado:  {rot:'Pagamento validado',   cls:'badge-paga',     dica:'Pagamento confirmado. A Stonni vai emitir a NF-e.'},
  nota_anexada:        {rot:'NF-e emitida',         cls:'badge-paga',     dica:'NF-e disponível abaixo. Liberação em andamento.'},
  liberado:            {rot:'Liberado',             cls:'badge-paga',     dica:'Pedido liberado.'},
  rejeitado:           {rot:'Recusado',             cls:'badge-recusada', dica:'Pedido recusado pela Stonni.'},
  cancelado:           {rot:'Cancelado',            cls:'badge-recusada', dica:'Pedido cancelado.'},
  estornado:           {rot:'Estornado',            cls:'badge-recusada', dica:'Pagamento estornado.'}
};
var PC_CAT={orcamento:'Orçamento',nf_venda:'Nota fiscal (NF-e)',comprovante_pagamento:'Comprovante de pagamento',boleto:'Boleto',outro:'Outro'};
var _pcPedidos=[];var _pcAnexos={};var _pcAcao=null;

function pcBadge(s){
  var d=PC_ST[s]||{rot:s||'—',cls:'badge-enviada'};
  return '<span class="badge '+d.cls+'">'+esc(d.rot)+'</span>';

// ---------- abas Catálogo / Meus pedidos ----------
// Aba em vez de item novo no menu: a barra lateral já tem 8 itens, e pedido de
// peça é continuação de comprar peça, não outro assunto.
function pcAba(qual){
  var chips=document.querySelectorAll('#pcAbas .filter-chip');
  for(var i=0;i<chips.length;i++)chips[i].classList.toggle('active',chips[i].getAttribute('data-aba')===qual);
  var cat=document.getElementById('compraPecasArea');
  var ped=document.getElementById('pcPedidosArea');
  if(!cat||!ped)return;
  cat.hidden=(qual!=='catalogo');
  ped.hidden=(qual!=='pedidos');
  if(qual==='pedidos'){
    ped.innerHTML='<div class="loading-full"><span class="spinner"></span> Carregando...</div>';
    renderPcPedidos(ped);
  }
}

// ---------- transição de status ----------
// O guard do banco devolve a razão em texto ("Anexe o arquivo antes desta
// etapa", "Transicao invalida"). Mostrar isso, e não um "erro 400" genérico —
// a autorizada precisa saber o que fazer, não que houve um número.
async function pcTransicionar(id,novo){
  try{
    var r=await fetch(SB_URL+'/rest/v1/prt_compras_pecas?id=eq.'+id,{
      method:'PATCH',
      headers:{'apikey':SB_KEY,'Authorization':AUTHZ,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({status:novo})
    });
    if(r.ok){
      bononiLog('ACAO','compra','PEDIDO_STATUS',String(id),novo);
      toast((PC_ST[novo]||{}).rot||'Status atualizado','success');
      var ped=document.getElementById('pcPedidosArea');
      if(ped)renderPcPedidos(ped);
      return true;
    }
    var j=await r.json().catch(function(){return null});
    var motivo=(j&&j.message)?j.message:('HTTP '+r.status);
    toast('Não deu para avançar: '+motivo,'error');
  }catch(e){
    console.error(e);
    toast('Erro de conexão ao atualizar o pedido','error');
  }
  return false;
}

// ---------- confirmação em modal ----------
// O app não usa confirm() nativo (Safari iOS). Mesmo markup dos outros modais
// daqui, então o observador de acessibilidade dá role=dialog, Escape e foco.
function pcConfirmar(titulo,msg,rotuloOk,perigo,aoConfirmar){
  _pcAcao=aoConfirmar;
  var chips=document.querySelectorAll('.modal-overlay.show');
  for(var i=0;i<chips.length;i++)chips[i].classList.remove('show');

    '<div class="modal-title">'+esc(titulo)+'<button class="modal-close" aria-label="Fechar" onclick="pcFecharConfirm()">'+ico('x',20)+'</button></div>'+
    '<p class="text-sm text-muted mb-16">'+esc(msg)+'</p>'+
    '<div class="flex gap-8 mt-16" style="justify-content:flex-end">'+
      '<button class="btn btn-ghost btn-sm" style="width:auto" onclick="pcFecharConfirm()">Voltar</button>'+
      '<button class="btn btn-sm" style="width:auto;'+estilo+'" onclick="pcConfirmarOk()">'+esc(rotuloOk)+'</button>'+
    '</div>'+
  '</div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}
function pcFecharConfirm(){
  _pcAcao=null;
  var m=document.getElementById('modalPc');
  if(m)m.remove();
}
function pcConfirmarOk(){

  var m=document.getElementById('modalPc');
  if(m)m.remove();
  if(typeof f==='function')f();
}

// ---------- anexos ----------
function pcAceito(f){return !!f&&(f.type==='application/pdf'||/^image\//.test(f.type))}

// Bucket privado: o link tem de ser assinado na hora do clique, e expira.
async function pcAbrirAnexo(anexoId){
  var a=_pcAnexos[anexoId];
  if(!a){toast('Anexo não encontrado','error');return}
  try{
    var sess=await sb.auth.getSession();
    var token=(sess&&sess.data&&sess.data.session)?sess.data.session.access_token:SB_KEY;
    var r=await fetch(SB_URL+'/storage/v1/object/sign/'+PC_BUCKET+'/'+a.storage_path,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({expiresIn:3600})
    });
    var d=await r.json().catch(function(){return null});
    if(!r.ok||!d||!d.signedURL)throw new Error((d&&d.message)||('HTTP '+r.status));
    window.open(SB_URL+'/storage/v1'+d.signedURL,'_blank');
  }catch(e){
    console.error(e);
    toast('Não deu para abrir o arquivo: '+(e&&e.message),'error');
  }
}

async function pcAnexar(compraId,categoria){
  var inp=document.createElement('input');
  inp.type='file';
  // sem `capture`: com ele o celular abre a câmera direto e a pessoa não
  // consegue escolher um PDF que já está no aparelho.
  inp.accept='image/*,application/pdf';
  inp.onchange=async function(){
    var file=inp.files&&inp.files[0];
    if(!file)return;
    if(!pcAceito(file)){toast('Envie uma imagem ou um PDF','error');return}
    if(file.size>20*1024*1024){toast('Arquivo acima de 20 MB','error');return}
    toast('Enviando '+file.name+'...');
    try{
      var ext=(file.name.split('.').pop()||'bin').toLowerCase();
      var limpo=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      // parceiro_id na 1ª pasta: é o que vai permitir escopar o bucket por
      // autorizada quando a RLS de storage entrar.
      var path=(_parceiroId||0)+'/'+compraId+'/'+categoria+'/'+Date.now()+'-'+limpo;
      var sess=await sb.auth.getSession();
      var token=(sess&&sess.data&&sess.data.session)?sess.data.session.access_token:SB_KEY;
      var up=await fetch(SB_URL+'/storage/v1/object/'+PC_BUCKET+'/'+path,{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},
        body:file
      });
      if(!up.ok)throw new Error('Upload falhou (HTTP '+up.status+')');
      var ins=await fetch(SB_URL+'/rest/v1/prt_compras_anexos',{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':AUTHZ,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({
          compra_id:compraId,categoria:categoria,nome_arquivo:file.name,storage_path:path,
          mime_type:file.type||null,extensao:ext,tamanho_bytes:file.size,
          enviado_por_email:_user?_user.email:null,
          enviado_por_nome:_parceiro?_parceiro.nome:null,
          enviado_por_papel:'autorizada'
        })
      });
      if(!ins.ok)throw new Error('Não deu para registrar o anexo (HTTP '+ins.status+')');
      bononiLog('ACAO','compra','ANEXAR_PEDIDO',String(compraId),categoria,ext);
      toast(file.type==='application/pdf'?'PDF anexado!':'Imagem anexada!','success');
      var ped=document.getElementById('pcPedidosArea');
      if(ped)renderPcPedidos(ped);
      // Sem isto a faixa continuaria pedindo "pague e anexe" depois de ela ja
      // ter anexado -- a acao que falta passou a ser outra.
      pendenciasCarregar();
    }catch(e){
      console.error(e);
      bononiLog('ERRO','compra','ANEXAR_PEDIDO',String(compraId),categoria,e&&e.message);
      toast('Erro no envio: '+(e&&e.message),'error');
    }
  };
  inp.click();
}

      '</div>';

// ---------- a lista de pedidos ----------
async function renderPcPedidos(box){
  if(!_parceiroId){box.innerHTML='<div class="empty-state"><p>Usuário sem vínculo de autorizada.</p></div>';return}
  try{
    var H={headers:{'apikey':SB_KEY,'Authorization':AUTHZ},cache:'no-store'};
    // A view já traz o nome da autorizada, a contagem de itens e quantos anexos
    // de cada tipo existem — evita uma consulta por cartão só para saber se o
    // botão "Já paguei" pode aparecer.
    var r=await fetch(SB_URL+'/rest/v1/prt_compras_detalhe?parceiro_id=eq.'+_parceiroId+'&order=criado_em.desc&select=*',H);
    _pcPedidos=await r.json();
    if(!Array.isArray(_pcPedidos))_pcPedidos=[];
    if(!_pcPedidos.length){
      box.innerHTML='<div class="empty-state">'+
        '<div class="empty-state-icon">'+ico('shopping-cart',40)+'</div>'+
        '<h3>Nenhum pedido ainda</h3>'+
        '<p>Monte um pedido na aba Catálogo.</p></div>';
      return;
    }
    var ids=_pcPedidos.map(function(p){return p.id}).join(',');
    var ra=await fetch(SB_URL+'/rest/v1/prt_compras_anexos?compra_id=in.('+ids+')&order=criado_em.asc&select=*',H);
    var anexos=await ra.json();if(!Array.isArray(anexos))anexos=[];
    _pcAnexos={};
    var porCompra={};
    anexos.forEach(function(a){_pcAnexos[a.id]=a;(porCompra[a.compra_id]=porCompra[a.compra_id]||[]).push(a)});
    var ri=await fetch(SB_URL+'/rest/v1/prt_compras_pecas_itens?compra_id=in.('+ids+')&order=id.asc&select=*',H);
    var itens=await ri.json();if(!Array.isArray(itens))itens=[];
    var porItens={};
    itens.forEach(function(i){(porItens[i.compra_id]=porItens[i.compra_id]||[]).push(i)});

    box.innerHTML=_pcPedidos.map(function(p){
      var d=PC_ST[p.status]||{};
      var its=porItens[p.id]||[];
      var podeComprovante=(p.status==='aguardando_pagamento');
      var jaTemComprovante=(Number(p.anexos_comprovante)||0)>0;
      var vence=p.data_vencimento?'<span class="text-xs" style="color:var(--warning)">vence '+fmtData(p.data_vencimento)+'</span>':'';

      var acoes='';
      if(podeComprovante){
        acoes='<div class="flex gap-8 mt-8" style="flex-wrap:wrap">'+
          '<button class="btn btn-primary btn-sm" style="width:auto" onclick="pcAnexarComprovante('+p.id+')">'+
            ico('receipt',13)+' Anexar comprovante</button>'+
          (jaTemComprovante
            ? '<button class="btn btn-outline btn-sm" style="width:auto" onclick="pcEnviarComprovante('+p.id+')">'+
                ico('check',13)+' Já paguei, avisar a Stonni</button>'
            : '')+
        '</div>'+
        '<p class="text-xs" style="color:var(--text-m);margin-top:4px">Aceita imagem <strong>ou</strong> PDF, até 20 MB. '+
          (jaTemComprovante?'Pode anexar mais de um arquivo antes de avisar.':'Anexe o comprovante para liberar o aviso.')+'</p>';
      }else if(p.status==='pendente'){
        acoes='<div class="mt-8"><button class="btn btn-outline btn-sm" style="width:auto;color:var(--danger);border-color:var(--danger)" '+
          'onclick="pcCancelarPedido('+p.id+')">'+ico('x',13)+' Cancelar pedido</button></div>';
      }

      return '<div class="card" id="pc-card-'+p.id+'" style="margin-bottom:10px">'+
        '<div class="flex justify-between items-center" style="flex-wrap:wrap;gap:6px">'+
          '<div><span class="fw-700" style="font-size:15px">'+esc(p.codigo||('#'+p.id))+'</span> '+pcBadge(p.status)+
            '<div class="text-xs" style="color:var(--text-m)">'+fmtData(p.criado_em)+' · '+(p.qtd_itens||its.length)+' item(ns)'+(vence?' · '+vence:'')+'</div></div>'+
          '<div style="text-align:right"><div class="fw-700" style="font-size:16px;color:var(--primary-txt)">'+fmt(p.valor_final)+'</div>'+
            (p.nf_venda?'<div class="text-xs" style="color:var(--text-m)">NF '+esc(p.nf_venda)+'</div>':'')+'</div>'+
        '</div>'+
        (d.dica?'<p class="text-xs" style="color:var(--text-m);margin:8px 0 0">'+esc(d.dica)+'</p>':'')+
        (p.motivo_recusa?'<p class="text-xs" style="color:var(--danger);margin:6px 0 0"><strong>Motivo:</strong> '+esc(p.motivo_recusa)+'</p>':'')+
        (its.length
          ? '<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:6px">'+
            its.map(function(i){
              return '<div class="flex justify-between text-xs" style="padding:1px 0">'+
                '<span>'+(i.quantidade||1)+'x <b>'+esc(i.referencia||'')+'</b> '+esc(i.nome||'')+'</span>'+
                '<span style="white-space:nowrap">'+fmt(i.preco_final)+'</span></div>';
            }).join('')+'</div>'
          : '')+
        '<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:6px">'+pcAnexosHtml(porCompra[p.id])+'</div>'+
        acoes+
      '</div>';
    }).join('');
    // Chegou pelo aviso: leva o olho ate o pedido certo. A lista vem por data,
    // entao o que espera por ela pode estar no meio de pedidos ja resolvidos.
    if(window._focarPedido){
      window._focarPedido=false;
      var alvoPc=(_pendComprov&&_pendComprov.length)?document.getElementById('pc-card-'+_pendComprov[0].id):null;
      if(alvoPc){
        var suavePc=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        alvoPc.scrollIntoView({behavior:suavePc?'smooth':'auto',block:'center'});
        alvoPc.style.transition='box-shadow .3s';
        alvoPc.style.boxShadow='0 0 0 3px #F5B36B';
        setTimeout(function(){alvoPc.style.boxShadow=''},2600);
      }
    }
  }catch(e){
    console.error(e);
    bononiLog('ERRO','compra','LOAD_MEUS_PEDIDOS',null,null,e&&e.message);
    box.innerHTML='<div class="empty-state"><p>Não foi possível carregar seus pedidos.</p>'+
      '<p class="text-xs" style="color:var(--text-m)">'+esc((e&&e.message)||'')+'</p></div>';
  }
}

// enter key no login
document.getElementById('loginSenha').addEventListener('keydown',function(e){if(e.key==='Enter')fazerLogin()});
document.getElementById('loginEmail').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('loginSenha').focus()});

// ===== SISTEMA DE LOGS — PADRÃO BONONI =====
function bononiLog(tipo,entidade,acao,idEntidade,nomeEntidade,extra){
  var payload={
    tipo:tipo,nivel:tipo==='ERRO'?'ERROR':'INFO',
    modulo:'portal-parceiro',acao:acao,
    usuario_email:_user?_user.email:null,
    usuario_nome:_parceiro?_parceiro.nome:null,
    entidade:entidade,id_entidade:idEntidade||null,nome_entidade:nomeEntidade||null,
    contexto:extra||null,url:window.location.href,user_agent:navigator.userAgent
  };
  fetch(SB_URL+'/rest/v1/prt_logs',{
    method:'POST',headers:{'apikey':SB_KEY,'Authorization':AUTHZ,'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  }).catch(function(e){console.error('Log falhou:',e)});
}

// Log de erros globais
window.addEventListener('error',function(e){
  bononiLog('ERRO','sistema','ERRO_JS',null,null,{msg:e.message,file:e.filename,line:e.lineno});
});
window.addEventListener('unhandledrejection',function(e){
  bononiLog('ERRO','sistema','PROMISE_REJEITADA',null,null,{reason:String(e.reason)});
});

// fechar dropdown ao clicar fora
document.addEventListener('click',function(e){
  if(!e.target.closest('.topbar-user')){
    document.getElementById('userDropdown').classList.remove('show');
  }
});
</script>
